apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: flycast
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Flycast
  description: Flycast is a multi-platform Sega Dreamcast, Naomi, Naomi 2, and Atomiswave
    emulator derived from reicast.
  category: Gaming
  baseImage: lscr.io/linuxserver/flycast:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - flycast
  - gaming
