apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: dolphin
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Dolphin
  description: Dolphin Emulator lets you play GameCube and Wii games with various
    graphical enhancements and other features are available to improve your game experience.
  category: Gaming
  baseImage: lscr.io/linuxserver/dolphin:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - dolphin
  - gaming
