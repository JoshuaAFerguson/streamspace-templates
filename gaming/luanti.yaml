apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: luanti
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Luanti
  description: luanti (formerly Minetest) is an open source voxel game-creation platform
    with easy modding and game creation
  category: Gaming
  baseImage: lscr.io/linuxserver/luanti:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - luanti
  - gaming
