apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: steamos
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Steamos
  description: SteamOS is an Arch based Linux distribution made by Valve Software.
    This container is a vanilla Arch install with Steam repositories added for software
    support. **This container will only work with modern AMD/Intel GPUs on a real
    Linux Host**
  category: Gaming
  baseImage: lscr.io/linuxserver/steamos:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - steamos
  - gaming
