apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: filezilla
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Filezilla
  description: FIleZilla Client is a fast and reliable cross-platform FTP, FTPS and
    SFTP client with lots of useful features and an intuitive graphical user interface.
  category: File Management
  baseImage: lscr.io/linuxserver/filezilla:latest
  defaultResources:
    memory: 2Gi
    cpu: 1000m
  ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - filezilla
  - file-management
