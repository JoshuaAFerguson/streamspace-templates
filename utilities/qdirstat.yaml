apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: qdirstat
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Qdirstat
  description: 'QDirStat Qt-based directory statistics: KDirStat without any KDE --
    from the author of the original KDirStat.'
  category: Storage
  baseImage: lscr.io/linuxserver/qdirstat:latest
  defaultResources:
    memory: 2Gi
    cpu: 1000m
  ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - qdirstat
  - storage
