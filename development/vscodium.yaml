apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: vscodium
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Vscodium
  description: VSCodium is a community-driven, freely-licensed binary distribution
    of Microsoft’s editor VS Code.
  category: Development
  baseImage: lscr.io/linuxserver/vscodium:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - vscodium
  - development
