apiVersion: stream.space/v1alpha1
kind: TemplateCatalog
metadata:
  name: streamspace-official-templates
  version: "2.0.0"
  repository: https://github.com/streamspace-dev/streamspace-templates
  description: |
    Official StreamSpace application templates. The catalog is curated to
    desktop GUI applications that genuinely benefit from being streamed
    via Selkies-GStreamer (WebRTC). Server-side apps with their own web
    UIs (media servers, download daemons, dashboards, wikis, reverse
    proxies, …) are intentionally excluded — those don't need StreamSpace.

spec:
  categories:
    - name: browsers
      displayName: Web Browsers
      description: Privacy-focused, mainstream, and specialty browsers
      icon: 🌐

    - name: communication
      displayName: Communication
      description: Desktop chat clients (WhatsApp, Discord, IRC, multi-messenger)
      icon: 💬

    - name: design
      displayName: Design & Graphics
      description: Image editing, vector art, 3D modeling, CAD, EDA, photography
      icon: 🎨

    - name: audio-video
      displayName: Audio & Video
      description: Audio editors, video editors, music players
      icon: 🎬

    - name: development
      displayName: Development
      description: Desktop IDEs, git clients, database tools, API testing
      icon: 💻

    - name: productivity
      displayName: Productivity
      description: Office suites, note-taking, e-book readers, references
      icon: 📝

    - name: gaming
      displayName: Gaming & Emulation
      description: Game emulators (PS1/PS2/PS3, GameCube, Doom, MAME) and games
      icon: 🎮

    - name: utilities
      displayName: Utilities
      description: File managers, FTP clients, disk utilities
      icon: 🛠️

    - name: security
      displayName: Security
      description: Password managers and security tooling
      icon: 🔐

    - name: remote-desktop
      displayName: Remote Desktop
      description: RDP/VNC clients (Remmina, RustDesk) for connecting to other machines
      icon: 🖥️

    - name: desktops
      displayName: Full Desktops
      description: Complete Linux desktop environments (Ubuntu/Alpine, KDE/XFCE/i3, Kali)
      icon: 🪟

    - name: selkies
      displayName: Selkies-Native (Reference)
      description: |
        First-party images built and published by streamspace-dev/streamspace-templates.
        Use these as the canonical examples when adding new Selkies-native templates.
      icon: ⚡

  # Selkies-only platform: every template MUST stream via Selkies-GStreamer
  # on port 8080. Templates inherited from the LinuxServer.io catalog that
  # used KasmVNC on port 3000 have been removed.
  streamingProtocol: selkies
