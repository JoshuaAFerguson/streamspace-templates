apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: digikam
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Digikam
  description: 'digiKam : Professional Photo Management with the Power of Open Source'
  category: Design & Graphics
  baseImage: lscr.io/linuxserver/digikam:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - digikam
  - design--graphics
