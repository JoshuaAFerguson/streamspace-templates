apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: darktable
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Darktable
  description: darktable is an open source photography workflow application and raw
    developer. A virtual lighttable and darkroom for photographers. It manages your
    digital negatives in a database, lets you view them through a zoomable lighttable
    and enables you to develop raw images and enhance them.
  category: Design & Graphics
  baseImage: lscr.io/linuxserver/darktable:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - darktable
  - design--graphics
