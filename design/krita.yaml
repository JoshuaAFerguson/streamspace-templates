apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: krita
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Krita
  description: Krita is a professional FREE and open source painting program. It is
    made by artists that want to see affordable art tools for everyone.
  category: Design & Graphics
  baseImage: lscr.io/linuxserver/krita:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - krita
  - design--graphics
