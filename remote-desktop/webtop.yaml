apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: webtop
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Webtop
  description: Full Linux desktop environment accessible via web browser. Available
    in multiple distributions and desktop environments.
  category: Remote Desktop
  baseImage: lscr.io/linuxserver/webtop:latest
  defaultResources:
    memory: 4Gi
    cpu: 2000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - webtop
  - remote-desktop
