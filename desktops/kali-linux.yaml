apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: kali-linux
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Kali-Linux
  description: kali-linux - is an Advanced Penetration Testing Linux distribution
    used for Penetration Testing, Ethical Hacking and network security assessments.
    KALI LINUX ™ is a trademark of OffSec.
  category: Remote Desktop,Security
  baseImage: lscr.io/linuxserver/kali-linux:latest
  defaultResources:
    memory: 2Gi
    cpu: 1000m
  ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - kali-linux
  - remote-desktopsecurity
