apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: libreoffice
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Libreoffice
  description: LibreOffice is a free and powerful office suite, and a successor to
    OpenOffice.org (commonly known as OpenOffice). Its clean interface and feature-rich
    tools help you unleash your creativity and enhance your productivity.
  category: Productivity
  baseImage: lscr.io/linuxserver/libreoffice:latest
  defaultResources:
    memory: 3Gi
    cpu: 1500m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - libreoffice
  - productivity
