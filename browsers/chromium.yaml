apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: chromium
  namespace: workspaces
  annotations:
    streamspace.dev/image-status: pending-migration
spec:
  displayName: Chromium
  description: Chromium is an open-source browser project that aims to build a safer,
    faster, and more stable way for all users to experience the web.
  category: Web Browsers
  baseImage: lscr.io/linuxserver/chromium:latest
  defaultResources:
    memory: 2Gi
    cpu: 1000m
  ports:
  - name: vnc
    containerPort: 3000
    protocol: TCP
  env:
  - name: PUID
    value: '1000'
  - name: PGID
    value: '1000'
  - name: TZ
    value: America/New_York
  volumeMounts:
  - name: user-home
    mountPath: /config
  capabilities:
  - Network
  - Clipboard
  tags:
  - chromium
  - web-browsers
