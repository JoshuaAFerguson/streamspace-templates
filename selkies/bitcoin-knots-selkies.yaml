apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: bitcoin-knots-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: bitcoin-knots-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: productivity
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Bitcoin Knots
  description: Bitcoin Knots full-node + GUI wallet (Bitcoin Core derivative with extra features) streamed via Selkies-GStreamer (WebRTC). Mount your blockchain data dir at /home/user/.bitcoin to avoid resyncing.
  category: Productivity
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/bitcoin-knots.svg
  baseImage: ghcr.io/streamspace-dev/bitcoin-knots-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 8Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - productivity
  - bitcoin
  - cryptocurrency
  - bitcoin-knots
  - selkies
