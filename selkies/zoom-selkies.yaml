apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: zoom-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: zoom-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: communication
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Zoom
  description: Zoom video conferencing client streamed via Selkies-GStreamer (WebRTC).
  category: Communication
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/zoom.svg
  baseImage: ghcr.io/streamspace-dev/zoom-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 4Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - communication
  - video-conferencing
  - meetings
  - zoom
  - selkies
