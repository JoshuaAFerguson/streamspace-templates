apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: prusaslicer-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: prusaslicer-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: design-graphics
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: PrusaSlicer
  description: PrusaSlicer FDM 3D printer slicer streamed via Selkies-GStreamer (WebRTC). Mount your project files at runtime.
  category: Design & Graphics
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/prusaslicer.svg
  baseImage: ghcr.io/streamspace-dev/prusaslicer-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 8Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - design
  - 3d-printing
  - slicer
  - prusaslicer
  - selkies
