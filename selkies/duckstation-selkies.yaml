apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: duckstation-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: duckstation-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: gaming
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: DuckStation
  description: DuckStation PlayStation 1 emulator streamed via Selkies-GStreamer (WebRTC). Bring your own PS1 BIOS and disc images.
  category: Gaming
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/duckstation.svg
  baseImage: ghcr.io/streamspace-dev/duckstation-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - gaming
  - emulator
  - playstation
  - duckstation
  - selkies
