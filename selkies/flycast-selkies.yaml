apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: flycast-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: flycast-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: gaming
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Flycast
  description: Flycast SEGA Dreamcast emulator streamed via Selkies-GStreamer (WebRTC). Bring your own Dreamcast BIOS and game images.
  category: Gaming
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/flycast.svg
  baseImage: ghcr.io/streamspace-dev/flycast-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - gaming
  - emulator
  - dreamcast
  - flycast
  - selkies
