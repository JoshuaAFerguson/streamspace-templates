apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: handbrake-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: handbrake-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: audio-video
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: HandBrake
  description: HandBrake open-source video transcoder streamed via Selkies-GStreamer (WebRTC). Configure HandBrake's hardware encoder under Video tab if running on a GPU host.
  category: Audio & Video
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/handbrake.svg
  baseImage: ghcr.io/streamspace-dev/handbrake-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 8Gi
      cpu: 8000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - audio-video
  - transcoder
  - handbrake
  - selkies
