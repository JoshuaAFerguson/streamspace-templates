apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: qdirstat-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: qdirstat-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: utilities
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: QDirStat
  description: QDirStat Qt-based directory statistics tool — visualize disk usage. Streamed via Selkies-GStreamer (WebRTC).
  category: Utilities
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/qdirstat.svg
  baseImage: ghcr.io/streamspace-dev/qdirstat-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - utilities
  - disk-usage
  - qdirstat
  - selkies
