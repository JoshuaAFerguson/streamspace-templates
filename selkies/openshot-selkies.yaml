apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: openshot-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: openshot-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: audio-video
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: OpenShot
  description: OpenShot non-linear video editor streamed via Selkies-GStreamer (WebRTC).
  category: Audio & Video
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/openshot.svg
  baseImage: ghcr.io/streamspace-dev/openshot-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 8Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - audio-video
  - video-editor
  - openshot
  - selkies
