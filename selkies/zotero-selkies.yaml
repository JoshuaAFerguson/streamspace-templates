apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: zotero-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: zotero-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: productivity
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Zotero
  description: Zotero open-source research and citation manager streamed via Selkies-GStreamer (WebRTC).
  category: Productivity
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/zotero.svg
  baseImage: ghcr.io/streamspace-dev/zotero-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - productivity
  - research
  - citations
  - zotero
  - selkies
