apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: rustdesk-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: rustdesk-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: remote-desktop
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: RustDesk
  description: RustDesk open-source remote desktop client (TeamViewer alternative) streamed via Selkies-GStreamer (WebRTC).
  category: Remote Desktop
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/rustdesk.svg
  baseImage: ghcr.io/streamspace-dev/rustdesk-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - remote-desktop
  - teamviewer-alternative
  - rustdesk
  - selkies
