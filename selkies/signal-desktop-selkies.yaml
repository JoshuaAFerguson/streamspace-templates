apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: signal-desktop-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: signal-desktop-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: communication
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Signal Desktop
  description: Signal Desktop end-to-end encrypted messenger streamed via Selkies-GStreamer (WebRTC).
  category: Communication
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/signal-desktop.svg
  baseImage: ghcr.io/streamspace-dev/signal-desktop-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - communication
  - chat
  - encrypted
  - signal
  - selkies
