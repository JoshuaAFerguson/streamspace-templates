apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: keepassxc-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: keepassxc-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: security
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: KeePassXC
  description: KeePassXC cross-platform password manager streamed via Selkies-GStreamer (WebRTC). Mount your .kdbx vault into the container at runtime.
  category: Security
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/keepassxc.svg
  baseImage: ghcr.io/streamspace-dev/keepassxc-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - security
  - password-manager
  - keepassxc
  - selkies
