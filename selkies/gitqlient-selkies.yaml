apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: gitqlient-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: gitqlient-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: development
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: GitQlient
  description: GitQlient Qt-based git GUI streamed via Selkies-GStreamer (WebRTC).
  category: Development
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/gitqlient.svg
  baseImage: ghcr.io/streamspace-dev/gitqlient-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - development
  - git
  - gitqlient
  - selkies
