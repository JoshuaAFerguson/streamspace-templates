apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: vscodium-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: vscodium-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: development
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: VSCodium
  description: VSCodium (FOSS VS Code build) streamed via Selkies-GStreamer (WebRTC).
  category: Development
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/vscodium.svg
  baseImage: ghcr.io/streamspace-dev/vscodium-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 4Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - editor
  - development
  - vscodium
  - selkies
