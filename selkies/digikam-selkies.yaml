apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: digikam-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: digikam-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: design-graphics
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: digiKam
  description: digiKam KDE photo manager (library, RAW, tagging, batch ops) streamed via Selkies-GStreamer (WebRTC). Mount your photo library at runtime.
  category: Design & Graphics
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/digikam.svg
  baseImage: ghcr.io/streamspace-dev/digikam-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 8Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - design
  - photo
  - library
  - kde
  - digikam
  - selkies
