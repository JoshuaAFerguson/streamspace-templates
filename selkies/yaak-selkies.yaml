apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: yaak-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: yaak-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: development
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Yaak
  description: Yaak desktop API client (Postman/Insomnia alternative) streamed via Selkies-GStreamer (WebRTC).
  category: Development
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/yaak.svg
  baseImage: ghcr.io/streamspace-dev/yaak-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - development
  - api
  - rest
  - graphql
  - yaak
  - selkies
