apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: thunderbird-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: thunderbird-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: communication
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Thunderbird
  description: Mozilla Thunderbird email client streamed via Selkies-GStreamer (WebRTC).
  category: Communication
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/thunderbird.svg
  baseImage: ghcr.io/streamspace-dev/thunderbird-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - communication
  - email
  - thunderbird
  - selkies
