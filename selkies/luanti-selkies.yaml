apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: luanti-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: luanti-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: gaming
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Luanti
  description: Luanti (formerly Minetest) voxel sandbox / multiplayer game engine streamed via Selkies-GStreamer (WebRTC).
  category: Gaming
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/luanti.svg
  baseImage: ghcr.io/streamspace-dev/luanti-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - gaming
  - sandbox
  - voxel
  - minetest
  - luanti
  - selkies
