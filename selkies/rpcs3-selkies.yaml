apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: rpcs3-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: rpcs3-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: gaming
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: RPCS3
  description: RPCS3 PlayStation 3 emulator streamed via Selkies-GStreamer (WebRTC). Bring your own PS3 firmware (PS3UPDAT.PUP) and game files.
  category: Gaming
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/rpcs3.svg
  baseImage: ghcr.io/streamspace-dev/rpcs3-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 8Gi
      cpu: 4000m
    limits:
      memory: 8Gi
      cpu: 8000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - gaming
  - emulator
  - playstation
  - rpcs3
  - selkies
