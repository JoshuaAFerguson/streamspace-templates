apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: mullvad-browser-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: mullvad-browser-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: web-browsers
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Mullvad Browser
  description: Mullvad Browser (Tor-derived privacy browser, no Tor network required) streamed via Selkies-GStreamer (WebRTC).
  category: Web Browsers
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/mullvad-browser.svg
  baseImage: ghcr.io/streamspace-dev/mullvad-browser-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - browser
  - web
  - privacy
  - tor-derived
  - mullvad-browser
  - selkies
