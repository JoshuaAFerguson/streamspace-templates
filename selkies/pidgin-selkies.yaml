apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: pidgin-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: pidgin-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: communication
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Pidgin
  description: Pidgin multi-protocol IM client (XMPP, IRC, etc) streamed via Selkies-GStreamer (WebRTC).
  category: Communication
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/pidgin.svg
  baseImage: ghcr.io/streamspace-dev/pidgin-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - communication
  - chat
  - xmpp
  - irc
  - pidgin
  - selkies
