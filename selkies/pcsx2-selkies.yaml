apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: pcsx2-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: pcsx2-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: gaming
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: PCSX2
  description: PCSX2 PlayStation 2 emulator streamed via Selkies-GStreamer (WebRTC). Bring your own PS2 BIOS dump and game ISOs.
  category: Gaming
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/pcsx2.svg
  baseImage: ghcr.io/streamspace-dev/pcsx2-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 4Gi
      cpu: 4000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - gaming
  - emulator
  - playstation
  - pcsx2
  - selkies
