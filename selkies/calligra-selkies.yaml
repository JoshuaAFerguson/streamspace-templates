apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: calligra-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: calligra-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: productivity
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Calligra
  description: Calligra KDE productivity & creative suite (Words, Sheets, Stage, Karbon, Plan) streamed via Selkies-GStreamer (WebRTC).
  category: Productivity
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/calligra.svg
  baseImage: ghcr.io/streamspace-dev/calligra-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 3Gi
      cpu: 1500m
    limits:
      memory: 3Gi
      cpu: 3000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - productivity
  - office
  - kde
  - calligra
  - selkies
