apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: xournalpp-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: xournalpp-selkies
    app.kubernetes.io/component: template
    streamspace.dev/category: productivity
    streamspace.dev/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Xournal++
  description: Xournal++ handwritten notes and PDF annotation, streamed via Selkies-GStreamer (WebRTC). Stylus / pen input is forwarded if the client supports it.
  category: Productivity
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/xournalpp.svg
  baseImage: ghcr.io/streamspace-dev/xournalpp-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'false'
  capabilities:
  - Network
  - Clipboard
  tags:
  - productivity
  - notes
  - pdf
  - annotation
  - xournalpp
  - selkies
