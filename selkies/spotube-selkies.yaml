apiVersion: stream.space/v1alpha1
kind: Template
metadata:
  name: spotube-selkies
  namespace: workspaces
  labels:
    app.kubernetes.io/name: spotube-selkies
    app.kubernetes.io/component: template
    streamspace.io/category: audio-video
    streamspace.io/streaming-protocol: selkies
  annotations:
    streamspace.dev/image-status: published
spec:
  displayName: Spotube
  description: Spotube third-party Spotify client (no Premium required) streamed via Selkies-GStreamer (WebRTC).
  category: Audio & Video
  icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/spotube.svg
  baseImage: ghcr.io/streamspace-dev/spotube-selkies:latest
  streamingProtocol: selkies
  defaultResources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 2Gi
      cpu: 2000m
  ports:
  - name: selkies
    containerPort: 8080
    protocol: TCP
  env:
  - name: TZ
    value: UTC
  - name: DISPLAY_SIZEW
    value: '1920'
  - name: DISPLAY_SIZEH
    value: '1080'
  - name: SELKIES_ENABLE_AUDIO
    value: 'true'
  capabilities:
  - Network
  - Audio
  - Clipboard
  tags:
  - audio-video
  - music-player
  - spotify
  - spotube
  - selkies
